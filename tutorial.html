<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tutorial &mdash; Layered Defense Simulation</title>
    <meta
      name="description"
      content="A short interactive walkthrough of how one security control actually works."
    />
    <link rel="stylesheet" href="css/style.css" />

    <!-- Runs before anything below paints, so the page never
         flashes the wrong theme — see theme-init.js for why this
         has no defer/async attribute. -->
    <script src="js/theme-init.js"></script>
  </head>
  <body>
    <div class="bg-grid" aria-hidden="true"></div>

    <header class="topbar">
      <div class="topbar__brand">
        <span class="brand-mark" aria-hidden="true"><svg width="14" height="14" viewBox="0 0 16 16" focusable="false"><polygon points="8,1 14.1,4.5 14.1,11.5 8,15 1.9,11.5 1.9,4.5" fill="none" stroke="currentColor" stroke-width="1.5" /></svg></span>
        <span class="brand-name"
          >Layered<span class="brand-name-accent">Defense</span></span
        >
      </div>
      <!-- No step progress bar here on purpose: a tutorial is a
           side trip from the Dashboard, not a numbered step in the
           simulation itself — "Back to Dashboard" (below) is the
           only navigation this page needs. -->
      <a href="dashboard.html" class="tutorial-exit">&larr; Back to Dashboard</a>

      <button
        type="button"
        id="theme-toggle"
        class="theme-toggle"
        aria-label="Switch to light mode"
      >
        <svg class="icon-sun" width="16" height="16" viewBox="0 0 16 16" aria-hidden="true">
          <circle cx="8" cy="8" r="3.2" fill="none" stroke="currentColor" stroke-width="1.4" />
          <g stroke="currentColor" stroke-width="1.4" stroke-linecap="round">
            <line x1="8" y1="0.5" x2="8" y2="2.3" />
            <line x1="8" y1="13.7" x2="8" y2="15.5" />
            <line x1="0.5" y1="8" x2="2.3" y2="8" />
            <line x1="13.7" y1="8" x2="15.5" y2="8" />
            <line x1="2.6" y1="2.6" x2="3.9" y2="3.9" />
            <line x1="12.1" y1="12.1" x2="13.4" y2="13.4" />
            <line x1="2.6" y1="13.4" x2="3.9" y2="12.1" />
            <line x1="12.1" y1="3.9" x2="13.4" y2="2.6" />
          </g>
        </svg>
        <svg class="icon-moon" width="16" height="16" viewBox="0 0 16 16" aria-hidden="true">
          <path
            d="M13.5 9.5A6 6 0 1 1 6.5 2.5 4.8 4.8 0 0 0 13.5 9.5Z"
            fill="none"
            stroke="currentColor"
            stroke-width="1.4"
            stroke-linejoin="round"
          />
        </svg>
      </button>
    </header>

    <main class="page-main">
      <section class="page-intro">
        <p class="eyebrow" id="tutorial-eyebrow">Tutorial</p>
        <h1 class="page-title" id="tutorial-title">Training Module</h1>
      </section>

      <div class="tutorial-stage glass" id="tutorial-stage" aria-live="polite">
        <!-- Filled in by tutorial.js -->
      </div>

      <div class="tutorial-instructor glass">
        <span class="tutorial-instructor__badge" aria-hidden="true">CI</span>
        <div class="tutorial-instructor__bubble">
          <p class="tutorial-instructor__label">Cyber Instructor</p>
          <p id="tutorial-instructor-text" class="tutorial-instructor__text">
            <!-- Filled in by tutorial.js -->
          </p>
        </div>
      </div>

      <div class="tutorial-controls" id="tutorial-controls">
        <!-- Filled in by tutorial.js: Next button, a toggle, or an
             action button, depending on the current scene. -->
      </div>
    </main>

    <footer class="site-footer">
      <p>
        Educational simulation built for a quantitative research study on
        layered network security. Runs entirely in your browser &mdash; HTML,
        CSS &amp; JavaScript only, no server, no data collection.
      </p>
    </footer>

    <!-- state.js first (escapeHtml), then tutorials.js (the TUTORIALS
         data), then tutorial.js (the engine that plays it). -->
    <script src="js/theme.js"></script>
    <script src="js/state.js"></script>
    <script src="js/tutorials.js"></script>
    <script src="js/tutorial.js"></script>
  </body>
</html>
